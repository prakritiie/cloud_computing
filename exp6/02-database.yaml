apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: microservices-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-db
  template:
    metadata:
      labels:
        app: redis-db
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(DB_PASS)"]
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: microservices-lab
spec:
  type: ClusterIP
  selector:
    app: redis-db
  ports:
    - port: 6379
      targetPort: 6379